name: Build Spider Clock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android Project
        run: |
          echo "Mencari project Gradle..."
          find "$GITHUB_WORKSPACE" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1)")

          echo "Project ditemukan di:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Isi folder:"
          ls -la

          echo "Mulai build APK..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Mencari APK..."
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
