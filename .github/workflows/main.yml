name: Build Spider Clock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Android Project
        run: |
          echo "Mencari ZIP project..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "Isi project:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -100

      - name: Find Gradle Project
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo "Isi:"
          ls -la

          echo "Build APK..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Mencari APK..."

          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
