name: Build Spider Clock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Project
        run: |
          mkdir project
          unzip -o SpiderClock_GitHub_Actions.zip -d project

      - name: Find Project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find "$PROJECT_DIR" -type f | tail -100
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" output/SpiderClock.apk

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-APK
          path: output/SpiderClock.apk
          if-no-files-found: error
